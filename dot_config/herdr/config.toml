# 日常の操作を dot_tmux.conf に近づける。
# prefix を使う組み込みキーバインドにも、この設定が反映される。
[keys]
prefix = "ctrl+q"

# # tmux と同じ新規ウィンドウ・次ペインへの移動キーにする。
# new_tab = "prefix+c"
# cycle_pane_next = "prefix+o"
#
# # Herdr のリサイズは専用モードで行う。
# # Shift+H/J/K/L はペイン交換に予約されているため上書きしない。
# resize_mode = "prefix+r"

[theme]
name = "solarized"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
# tmux と同様、新規タブを即座に作成する。
prompt_new_tab_name = false

[ui.toast]
delivery = "system"
